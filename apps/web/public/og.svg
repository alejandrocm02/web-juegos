  <text x="80" y="510" font-family="DejaVu Sans" font-size="29" fill="#9b8cf0">Billar  ·  Quiz  ·  Dardos  ·  Minigolf  ·  Bolos  ·  Karts</text>
  <text x="80" y="556" font-family="DejaVu Sans" font-size="29" fill="#9b8cf0">Battle Royale  ·  Blackjack  ·  Songless  ·  Tanques  ·  y más</text>
