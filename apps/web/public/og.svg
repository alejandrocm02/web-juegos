      <stop offset="0" stop-color="#181334"/>
      <stop offset="1" stop-color="#0a0912"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="#7c5cff"/>

  <!-- Palanca arcade -->
