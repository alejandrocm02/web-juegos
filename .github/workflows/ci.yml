name: Calidad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar proyecto completo
        run: npm run check

      # Se ejecuta aparte de `check` para que el informe se publique aunque los
      # umbrales no se cumplan y se vea cuanto ha bajado y donde.
      - name: Medir cobertura
        run: npm run test:coverage

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar trazas E2E si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Los tests no ejecutan el contenedor, y ya van dos veces que un cambio pasa
  # `check` y rompe el despliegue (Prisma 7, Zod 4). Aqui se construye la misma
  # imagen que usa Render y se comprueba que arranca y responde.
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres de pruebas, el mismo motor que Neon en produccion.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: arcade
          POSTGRES_PASSWORD: arcade
          POSTGRES_DB: arcade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Construir la imagen de produccion
        run: docker build -t parque-arcade:ci .

      - name: Arrancar y comprobar que responde
        run: |
          docker run -d --name arcade -p 3001:3001 parque-arcade:ci
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then
              echo
              echo "Arrancado en el intento $intento"
              break
            fi
            sleep 2
          done
          docker logs arcade
          curl -fsS http://localhost:3001/api/health > /dev/null
          curl -fsS http://localhost:3001/ | grep -q '<div id="root"'
          # El arranque captura los fallos de base de datos y sigue en memoria:
          # sin esta linea la web se veria bien y las marcas no se guardarian.
          docker logs arcade 2>&1 | grep -q 'Persistencia SQLite lista'

      - name: Arrancar con Postgres y comprobar que guarda y lee
        env:
          PGPASSWORD: arcade
        run: |
          # Misma imagen, otra DATABASE_URL: es como se despliega con Neon.
          arrancar() {
            docker run -d --name "$1" --network host -e PORT=3002 \
              -e DATABASE_URL=postgresql://arcade:arcade@localhost:5432/arcade \
              parque-arcade:ci
            for intento in $(seq 1 30); do
              curl -fsS http://localhost:3002/api/health > /dev/null && break
              sleep 2
            done
            docker logs "$1"
            docker logs "$1" 2>&1 | grep -q 'Persistencia Postgres lista'
          }
          arrancar arcade-pg
          # El arranque ha creado las tablas con `db push`.
          psql -h localhost -U arcade -d arcade -v ON_ERROR_STOP=1 -c '
            INSERT INTO "MatchRecord" (id, "roomCode", game, players, winners)
              VALUES ($$m1$$, $$CI001$$, $$quiz$$, 1, $$p1$$);
            INSERT INTO "PlayerResult" (id, "matchId", alias, score, won)
              VALUES ($$r1$$, $$m1$$, $$Persistente CI$$, 10, true);'
          # Un despliegue nuevo es un contenedor nuevo: los datos deben seguir ahi
          # y el `db push` del arranque no debe borrarlos.
          docker rm -f arcade-pg
          arrancar arcade-pg-2
          curl -fsS http://localhost:3002/api/leaderboard | tee /dev/stderr | grep -q 'Persistente CI'
