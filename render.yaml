# Despliegue de un solo servicio en Render (plan gratuito).
# El servidor Express sirve el cliente compilado y los WebSockets de Socket.IO,
# asi que no hay CORS entre partes ni un segundo servicio que mantener.
services:
  - type: web
    name: parque-arcade
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Cadena de conexion de la base de datos.
      #
      # Se rellena a mano en el panel de Render (Environment) porque es un
      # secreto. Con una URL `postgres://...` las marcas personales y las
      # estadisticas sobreviven a los reinicios; con `file:./dev.db` se usa
      # SQLite, que en el plan gratuito se borra cada vez que el servicio
      # despierta porque el disco es efimero.
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      # CORS_ORIGINS y PUBLIC_WEB_URL no hacen falta: cliente y servidor
      # comparten origen. Rellena PUBLIC_WEB_URL solo si sirves el cliente
      # desde otro dominio.
